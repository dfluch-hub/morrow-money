<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Morrow Money">
  <title>Morrow Money — Financial Mindset OS</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192x192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151f32',
              900: '#0b0f19'
            }
          }
        }
      }
    };
  </script>

  <style>
    [x-cloak] { display: none !important; }
    html, body { height: 100%; background: #0b0f19; overscroll-behavior: none; }
    body { min-height: 100dvh; }
    * { -webkit-tap-highlight-color: transparent; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 h-[100dvh] w-screen overflow-hidden flex flex-col font-sans antialiased select-none"
      x-data="morrowApp()" x-init="init()">

  <header class="px-6 pt-[max(1.25rem,env(safe-area-inset-top))] pb-4 flex justify-between items-center bg-slate-900 z-20 shrink-0">
    <div>
      <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">Morrow Tools</span>
      <h1 class="text-xl font-extrabold tracking-tight text-white">Morrow Money</h1>
    </div>
    <div class="flex items-center gap-2">
      <button x-show="currentView !== 'dashboard'" @click="goDashboard()" class="p-2.5 bg-slate-800 rounded-2xl border border-slate-700/50 text-slate-300 active:scale-95 transition-all" aria-label="Home">
        <i data-lucide="home" class="w-5 h-5"></i>
      </button>
      <button @click="exportData()" class="p-2.5 bg-slate-800 rounded-2xl border border-slate-700/50 text-slate-300 active:scale-95 transition-all" aria-label="Backup exportieren">
        <i data-lucide="download" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-hidden relative flex flex-col px-6 pb-[max(1.25rem,env(safe-area-inset-bottom))]">

    <!-- DASHBOARD -->
    <section x-show="currentView === 'dashboard'" x-transition.opacity class="flex-1 flex flex-col gap-5 min-h-0">
      <div class="bg-gradient-to-br from-slate-800 to-slate-850 rounded-[2.5rem] p-6 text-center border border-slate-700/60 shadow-xl relative overflow-hidden shrink-0">
        <div class="absolute -right-6 -bottom-6 opacity-5 text-emerald-400">
          <i data-lucide="shield-check" class="w-32 h-32"></i>
        </div>
        <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Diesen Monat nicht ausgegeben</span>
        <div class="text-4xl font-black text-emerald-400 mt-2 tracking-tight" x-text="money(monthlySaved)"></div>
        <div class="text-[11px] text-slate-400 mt-1" x-text="graveyard.length + (graveyard.length === 1 ? ' Gegenstand im Graveyard' : ' Gegenstände im Graveyard')"></div>
      </div>

      <div class="grid grid-cols-2 gap-4 flex-1 min-h-0">
        <button @click="open('cost')" class="bg-slate-800/90 p-5 rounded-[2rem] flex flex-col justify-between border border-slate-700/50 active:scale-95 transition-all text-left">
          <div class="bg-indigo-500/10 w-12 h-12 rounded-2xl flex items-center justify-center text-indigo-400">
            <i data-lucide="calculator" class="w-6 h-6"></i>
          </div>
          <div><h2 class="font-bold text-white text-base">Cost / Time</h2><p class="text-xs text-slate-400 mt-0.5">Arbeitszeit statt Preis</p></div>
        </button>

        <button @click="open('impulse')" class="bg-slate-800/90 p-5 rounded-[2rem] flex flex-col justify-between border border-slate-700/50 active:scale-95 transition-all text-left relative">
          <div x-show="timers.length > 0" x-text="timers.length" class="absolute top-4 right-4 bg-rose-500 text-white text-[10px] font-extrabold min-w-5 h-5 px-1 rounded-full flex items-center justify-center"></div>
          <div class="bg-rose-500/10 w-12 h-12 rounded-2xl flex items-center justify-center text-rose-400"><i data-lucide="timer" class="w-6 h-6"></i></div>
          <div><h2 class="font-bold text-white text-base">Impulse</h2><p class="text-xs text-slate-400 mt-0.5">72h Pause</p></div>
        </button>

        <button @click="open('graveyard')" class="bg-slate-800/90 p-5 rounded-[2rem] flex flex-col justify-between border border-slate-700/50 active:scale-95 transition-all text-left">
          <div class="bg-emerald-500/10 w-12 h-12 rounded-2xl flex items-center justify-center text-emerald-400"><i data-lucide="ghost" class="w-6 h-6"></i></div>
          <div><h2 class="font-bold text-white text-base">Graveyard</h2><p class="text-xs text-slate-400 mt-0.5">Nicht gekaufte Items</p></div>
        </button>

        <button @click="openFuture()" class="bg-slate-800/90 p-5 rounded-[2rem] flex flex-col justify-between border border-slate-700/50 active:scale-95 transition-all text-left">
          <div class="bg-emerald-500/10 w-12 h-12 rounded-2xl flex items-center justify-center text-emerald-400"><i data-lucide="trending-up" class="w-6 h-6"></i></div>
          <div><h2 class="font-bold text-white text-base">Future Me</h2><p class="text-xs text-slate-400 mt-0.5">7% · 30 Jahre</p></div>
        </button>
      </div>
    </section>

    <!-- COST / TIME -->
    <section x-cloak x-show="currentView === 'cost'" class="flex-1 flex flex-col min-h-0 overflow-y-auto pr-1">
      <div class="bg-slate-800 rounded-[2.5rem] p-6 border border-slate-700/50 space-y-4 mb-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="calculator" class="w-5 h-5 text-indigo-400"></i> Arbeitszeit Rechner</h2>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Produkt / Wunsch</label>
          <input type="text" x-model="calc.item" maxlength="80" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="z.B. Neue Kopfhörer">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Preis (€)</label>
            <input type="number" inputmode="decimal" min="0" step="0.01" x-model.number="calc.price" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 text-white text-base font-bold focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Netto / Std (€)</label>
            <input type="number" inputmode="decimal" min="0" step="0.01" x-model.number="calc.hourlyWage" @input="saveSettings()" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 text-white text-base font-bold focus:outline-none focus:border-indigo-500">
          </div>
        </div>
      </div>

      <div class="bg-gradient-to-br from-indigo-950/40 to-slate-800 rounded-[2.5rem] p-6 border border-indigo-500/30 text-center space-y-3 mb-4">
        <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Das kostet dich effektiv</span>
        <div class="text-3xl font-black text-white" x-text="formattedWorkTime"></div>
        <div class="inline-block px-4 py-1.5 rounded-full text-xs font-bold" :class="verdict.class" x-text="verdict.text"></div>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-auto pb-1">
        <button @click="sendToImpulse()" :disabled="!canSaveCalc" class="bg-rose-500/10 border border-rose-500/30 text-rose-400 disabled:opacity-30 font-bold py-3.5 px-3 rounded-2xl text-xs flex items-center justify-center gap-2 active:scale-95">
          <i data-lucide="timer" class="w-4 h-4"></i> 72h warten
        </button>
        <button @click="sendToGraveyardDirect()" :disabled="!canSaveCalc" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 disabled:opacity-30 font-bold py-3.5 px-3 rounded-2xl text-xs flex items-center justify-center gap-2 active:scale-95">
          <i data-lucide="ghost" class="w-4 h-4"></i> Nicht gekauft
        </button>
      </div>
    </section>

    <!-- IMPULSE -->
    <section x-cloak x-show="currentView === 'impulse'" class="flex-1 flex flex-col min-h-0 overflow-y-auto">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="timer" class="w-5 h-5 text-rose-400"></i> Aktive Impulse</h2>
        <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400 font-medium" x-text="timers.length + ' aktiv'"></span>
      </div>

      <template x-if="timers.length === 0">
        <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-500">
          <i data-lucide="shield-alert" class="w-12 h-12 mb-3 opacity-30"></i>
          <p class="text-sm font-medium">Keine aktiven Timer.</p>
          <p class="text-xs mt-1 max-w-xs">Ein Kauf aus Cost / Time landet hier für 72 Stunden.</p>
        </div>
      </template>

      <div class="space-y-3 pb-1">
        <template x-for="timer in timers" :key="timer.id">
          <article class="bg-slate-800 p-4 rounded-2xl border border-slate-700/50">
            <div class="flex justify-between gap-3 items-start">
              <div class="min-w-0">
                <h3 class="font-bold text-white text-sm truncate" x-text="timer.item"></h3>
                <p class="text-xs text-emerald-400 font-bold mt-0.5" x-text="money(timer.price)"></p>
              </div>
              <span class="text-[10px] px-2.5 py-1 rounded-full font-bold" :class="isDue(timer) ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/10 text-rose-300'" x-text="timerLabel(timer)"></span>
            </div>
            <div class="mt-3 h-1.5 bg-slate-900 rounded-full overflow-hidden"><div class="h-full bg-rose-400 rounded-full" :style="'width:' + timerProgress(timer) + '%' "></div></div>
            <div class="grid grid-cols-2 gap-2 mt-3">
              <button @click="resolveTimer(timer, false)" class="bg-slate-700/60 text-slate-300 py-2.5 rounded-xl text-xs font-bold">Doch gekauft</button>
              <button @click="resolveTimer(timer, true)" class="bg-emerald-500/15 text-emerald-300 py-2.5 rounded-xl text-xs font-bold">Nicht gekauft</button>
            </div>
          </article>
        </template>
      </div>
    </section>

    <!-- GRAVEYARD -->
    <section x-cloak x-show="currentView === 'graveyard'" class="flex-1 flex flex-col min-h-0 overflow-y-auto">
      <div class="flex justify-between items-center mb-4 shrink-0 gap-3">
        <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="ghost" class="w-5 h-5 text-emerald-400"></i> Purchase Graveyard</h2>
        <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-emerald-400 font-bold whitespace-nowrap" x-text="money(totalSaved) + ' behalten'"></span>
      </div>

      <template x-if="graveyard.length === 0">
        <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-500">
          <i data-lucide="ghost" class="w-12 h-12 mb-3 opacity-30"></i>
          <p class="text-sm font-medium">Dein Graveyard ist leer.</p>
          <p class="text-xs mt-1">Nicht gekaufte Dinge werden hier sichtbar.</p>
        </div>
      </template>

      <div class="space-y-3 pb-1">
        <template x-for="item in graveyard" :key="item.id">
          <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50 flex justify-between items-center gap-3">
            <div class="min-w-0">
              <h3 class="font-bold text-white text-sm truncate line-through decoration-slate-500" x-text="item.item"></h3>
              <p class="text-[10px] text-slate-400 mt-0.5" x-text="formatDate(item.savedAt)"></p>
            </div>
            <span class="text-emerald-400 font-black text-sm whitespace-nowrap" x-text="'+' + money(item.price)"></span>
          </div>
        </template>
      </div>
    </section>

    <!-- FUTURE ME -->
    <section x-cloak x-show="currentView === 'future'" class="flex-1 flex flex-col min-h-0 overflow-y-auto">
      <div class="bg-slate-800 rounded-[2.5rem] p-6 border border-slate-700/50 mb-4">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i> Future Me</h2>
            <p class="text-xs text-slate-400 mt-1">Dein behaltenes Geld · 7 % p.a. · 30 Jahre</p>
          </div>
          <div class="text-right"><div class="text-[10px] uppercase text-slate-500 font-bold">Heute</div><div class="text-sm font-bold text-white" x-text="money(totalSaved)"></div></div>
        </div>
      </div>

      <template x-if="totalSaved <= 0">
        <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-500">
          <i data-lucide="sprout" class="w-12 h-12 mb-3 opacity-30"></i>
          <p class="text-sm font-medium">Noch kein Startkapital.</p>
          <p class="text-xs mt-1">Sobald Geld im Graveyard liegt, erscheint hier die 30-Jahres-Projektion.</p>
        </div>
      </template>

      <template x-if="totalSaved > 0">
        <div class="space-y-4 pb-1">
          <div class="bg-emerald-500/[0.07] border border-emerald-500/20 rounded-[2.5rem] p-6 text-center">
            <div class="text-[10px] uppercase tracking-widest text-emerald-300/70 font-bold">In 30 Jahren</div>
            <div class="text-4xl font-black text-emerald-400 mt-2" x-text="money(futureValue30)"></div>
            <div class="text-xs text-slate-400 mt-2" x-text="'Potenzieller Zuwachs: ' + money(futureGain30)"></div>
          </div>
          <div class="bg-slate-800 rounded-[2rem] p-4 border border-slate-700/50 h-[260px]"><canvas id="futureChart"></canvas></div>
          <p class="text-[10px] text-slate-600 text-center px-3">Modellrechnung mit konstanter Rendite von 7 % p.a. Keine Renditegarantie oder Anlageberatung.</p>
        </div>
      </template>
    </section>
  </main>

<script>
function morrowApp() {
  return {
    STORAGE_KEY: 'morrow-money-v2',
    currentView: 'dashboard',
    calc: { item: '', price: null, hourlyWage: 20 },
    timers: [],
    graveyard: [],
    now: Date.now(),
    chart: null,
    ticker: null,

    init() {
      this.loadData();
      this.ticker = setInterval(() => { this.now = Date.now(); }, 30000);
      this.$watch('currentView', () => setTimeout(() => this.refreshIcons(), 30));
      setTimeout(() => this.refreshIcons(), 30);
    },

    loadData() {
      try {
        const raw = localStorage.getItem(this.STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          this.timers = Array.isArray(data.timers) ? data.timers : [];
          this.graveyard = Array.isArray(data.graveyard) ? data.graveyard : [];
          if (Number(data.hourlyWage) > 0) this.calc.hourlyWage = Number(data.hourlyWage);
          return;
        }
        this.migrateLegacy();
      } catch (_) {}
    },

    migrateLegacy() {
      try {
        const v1 = JSON.parse(localStorage.getItem('morrow-money-v1') || '{}');
        if (Array.isArray(v1.impulses)) {
          this.timers = v1.impulses.map(x => ({
            id: x.id || Date.now() + Math.random(),
            item: x.product || 'Unbenannter Kauf',
            price: Number(x.price) || 0,
            createdAt: Number(x.createdAt) || Date.now(),
            expiresAt: Number(x.expiresAt) || ((Number(x.createdAt) || Date.now()) + 72*60*60*1000)
          }));
        }
        if (Array.isArray(v1.graveyard)) {
          this.graveyard = v1.graveyard.map(x => ({
            id: x.id || Date.now() + Math.random(),
            item: x.product || 'Unbenannter Kauf',
            price: Number(x.price) || 0,
            savedAt: Number(x.savedAt) || Date.now()
          }));
        }
        if (Number(v1?.settings?.hourlyWage) > 0) this.calc.hourlyWage = Number(v1.settings.hourlyWage);
        const old = JSON.parse(localStorage.getItem('morrow_money_data') || '{}');
        if (!this.timers.length && Array.isArray(old.timers)) {
          this.timers = old.timers.map(x => ({ id: x.id || Date.now()+Math.random(), item: x.item || 'Unbenannter Kauf', price: Number(x.price)||0, createdAt: Date.now(), expiresAt: Date.now()+72*60*60*1000 }));
        }
        if (!this.graveyard.length && Array.isArray(old.graveyard)) {
          this.graveyard = old.graveyard.map(x => ({ id: x.id || Date.now()+Math.random(), item: x.item || 'Unbenannter Kauf', price: Number(x.price)||0, savedAt: Date.now() }));
        }
        if (Number(old.hourlyWage) > 0) this.calc.hourlyWage = Number(old.hourlyWage);
        this.saveData();
      } catch (_) {}
    },

    saveData() {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ timers: this.timers, graveyard: this.graveyard, hourlyWage: Number(this.calc.hourlyWage)||20 }));
    },
    saveSettings() { this.saveData(); },
    open(view) { this.currentView = view; },
    goDashboard() { this.destroyChart(); this.currentView = 'dashboard'; },
    refreshIcons() { if (window.lucide) lucide.createIcons(); },

    get canSaveCalc() { return String(this.calc.item || '').trim().length > 0 && Number(this.calc.price) > 0; },
    get workHours() { const p=Number(this.calc.price), w=Number(this.calc.hourlyWage); return p>0 && w>0 ? p/w : 0; },
    get formattedWorkTime() {
      const mins = Math.round(this.workHours * 60);
      if (!mins) return '0 Std';
      const h = Math.floor(mins/60), m = mins%60;
      return h ? `${h} Std ${m} Min` : `${m} Min`;
    },
    get verdict() {
      const h = this.workHours;
      if (!h) return { text: 'Preis und Stundenlohn eingeben', class: 'bg-slate-700/60 text-slate-300' };
      if (h < 3) return { text: 'Leichtgewicht', class: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' };
      if (h < 10) return { text: 'Spürbar – kurz prüfen', class: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' };
      return { text: 'Große Entscheidung – Abstand hilft', class: 'bg-rose-500/20 text-rose-400 border border-rose-500/30' };
    },

    sendToImpulse() {
      if (!this.canSaveCalc) return;
      const now = Date.now();
      this.timers.unshift({ id: `t-${now}-${Math.random().toString(36).slice(2,7)}`, item: this.calc.item.trim(), price: Number(this.calc.price), createdAt: now, expiresAt: now + 72*60*60*1000 });
      this.saveData(); this.resetCalc(); this.currentView='impulse';
    },
    sendToGraveyardDirect() {
      if (!this.canSaveCalc) return;
      this.graveyard.unshift({ id: `g-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, item: this.calc.item.trim(), price: Number(this.calc.price), savedAt: Date.now() });
      this.saveData(); this.resetCalc(); this.currentView='graveyard';
    },
    resetCalc() { this.calc.item=''; this.calc.price=null; },
    resolveTimer(timer, success) {
      this.timers = this.timers.filter(t => t.id !== timer.id);
      if (success) this.graveyard.unshift({ id: `g-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, item: timer.item, price: Number(timer.price)||0, savedAt: Date.now() });
      this.saveData();
    },
    isDue(timer) { return this.now >= Number(timer.expiresAt); },
    timerProgress(timer) {
      const start=Number(timer.createdAt), end=Number(timer.expiresAt);
      if (!start || !end || end<=start) return 100;
      return Math.max(0, Math.min(100, ((this.now-start)/(end-start))*100));
    },
    timerLabel(timer) {
      const diff = Number(timer.expiresAt) - this.now;
      if (diff <= 0) return '72h geschafft';
      const mins = Math.ceil(diff/60000), days=Math.floor(mins/1440), hours=Math.floor((mins%1440)/60), m=mins%60;
      if (days>0) return `${days}T ${hours}h`;
      if (hours>0) return `${hours}h ${m}m`;
      return `${Math.max(1,m)}m`;
    },

    get totalSaved() { return this.graveyard.reduce((s,x)=>s+(Number(x.price)||0),0); },
    get monthlySaved() {
      const n=new Date();
      return this.graveyard.reduce((s,x)=>{ const d=new Date(Number(x.savedAt)); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() ? s+(Number(x.price)||0) : s; },0);
    },
    get futureValue30() { return this.totalSaved * Math.pow(1.07,30); },
    get futureGain30() { return Math.max(0,this.futureValue30-this.totalSaved); },
    openFuture() { this.currentView='future'; this.$nextTick(()=>{ this.refreshIcons(); this.renderChart(); }); },
    destroyChart() { if (this.chart) { this.chart.destroy(); this.chart=null; } },
    renderChart() {
      this.destroyChart();
      if (!window.Chart || this.totalSaved<=0) return;
      const el=document.getElementById('futureChart'); if(!el) return;
      const labels=Array.from({length:31},(_,i)=>i);
      const data=labels.map(y=>this.totalSaved*Math.pow(1.07,y));
      this.chart=new Chart(el,{type:'line',data:{labels,datasets:[{data,borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.08)',fill:true,tension:.35,pointRadius:0,borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:i=>`Jahr ${i[0].label}`,label:c=>this.money(c.parsed.y)}}},scales:{x:{grid:{display:false},ticks:{color:'#64748b',maxTicksLimit:7}},y:{grid:{color:'rgba(148,163,184,.08)'},ticks:{color:'#64748b',callback:v=>this.compactMoney(v)}}}}});
    },

    money(v) { return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(v)||0); },
    compactMoney(v) { const n=Number(v)||0; if(n>=1000000) return `${(n/1000000).toFixed(1).replace('.',',')} Mio €`; if(n>=1000) return `${(n/1000).toFixed(1).replace('.',',')} Tsd €`; return this.money(n); },
    formatDate(ts) { return new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(Number(ts)||Date.now())); },

    exportData() {
      const payload = JSON.stringify({ version:2, exportedAt:new Date().toISOString(), timers:this.timers, graveyard:this.graveyard, hourlyWage:this.calc.hourlyWage }, null, 2);
      const blob=new Blob([payload],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='morrow-money-backup.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
  };
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
